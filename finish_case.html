<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>mObywatel</title>
    <link rel="stylesheet" href="assets/finish_case.css">
    <link rel="stylesheet" href="assets/main.css?v=3">
    <link rel="icon" type="image/x-icon" href="https://i.imgur.com/U7TRg0V.png">
    <link rel="apple-touch-icon" href="https://i.imgur.com/U7TRg0V.png">
    <link rel="shortcut icon" href="https://i.imgur.com/U7TRg0V.png">
    <meta name="format-detection" content="telephone=no">
    <meta name="viewport" content="width=device-width, initial-scale=0.8, user-scalable=no">
    <meta name="mobile-web-app-capable" content="yes">
</head>
<body class="has-blur-topbar">
    <script src="assets/clear_cache.js"></script>
    <div class="bottom_bar">
        <div class="bottom_bar_grid">
            <div class="bottom_element_grid" send="home">
                <div class="bottom_element_image home_open home"></div>
                <p class="bottom_element_text open">Dokumenty</p>
            </div>
            <div class="bottom_element_grid" send="services">
                <div class="bottom_element_image services"></div>
                <p class="bottom_element_text">Usługi</p>
            </div>
            <div class="bottom_element_grid" send="qr">
                <div class="bottom_element_image qr"></div>
                <p class="bottom_element_text">Kod QR</p>
            </div>
            <div class="bottom_element_grid" send="more">
                <div class="bottom_element_image more"></div>
                <p class="bottom_element_text">Więcej</p>
            </div>
            <div class="bottom_element_grid" send="search">
                <div class="bottom_element_image search"></div>
                <p class="bottom_element_text">Szukaj</p>
            </div>
        </div>
    </div>

    <div class="top_grid">
        <div class="action_grid" onclick="sendTo('services')">
            <svg class="back_arrow" width="12" height="20" viewBox="0 0 12 20" fill="none">
                <path d="M10 2L2 10L10 18" stroke="#3b82f6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <p class="back_text">Wróć</p>
        </div>
        <p class="title_text">Załatw sprawę</p>
    </div>

    <div class="container">
        <div class="icon-section">
            <div class="icon-circle">
                <img src="./services_files/finish_case.png" alt="Załatw sprawę" style="width: 50px; height: 50px;">
            </div>
        </div>

        <div class="titleall">
            <div class="title">Załatwiaj sprawy<br>urzędowe online</div>
            <div class="subtitle">Złóż wniosek w aplikacji – szybko i wygodnie.</div>
        </div>

        <div class="cards">
            <div class="card error-trigger">
                <div class="card-content">
                    <div class="card-icon">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#444" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="4" width="18" height="16" rx="2"/>
                            <circle cx="9" cy="10" r="2"/>
                            <line x1="15" y1="9" x2="19" y2="9"/>
                            <line x1="15" y1="13" x2="19" y2="13"/>
                            <line x1="7" y1="16" x2="17" y2="16"/>
                        </svg>
                    </div>
                    <div class="card-text">
                        <div class="card-title">Dowód osobisty</div>
                    </div>
                    <svg class="card-arrow" width="10" height="16" viewBox="0 0 10 16" fill="none">
                        <path d="M2 2L8 8L2 14" stroke="#bbb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </div>
            </div>

            <div class="card-divider"></div>

            <div class="card error-trigger">
                <div class="card-content">
                    <div class="card-icon">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#444" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="9"/>
                            <line x1="3.6" y1="9" x2="20.4" y2="9"/>
                            <line x1="3.6" y1="15" x2="20.4" y2="15"/>
                            <path d="M11.5 3a17 17 0 0 0 0 18"/>
                            <path d="M12.5 3a17 17 0 0 1 0 18"/>
                        </svg>
                    </div>
                    <div class="card-text">
                        <div class="card-title">Paszport</div>
                    </div>
                    <svg class="card-arrow" width="10" height="16" viewBox="0 0 10 16" fill="none">
                        <path d="M2 2L8 8L2 14" stroke="#bbb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </div>
            </div>

            <div class="card-divider"></div>

            <div class="card error-trigger">
                <div class="card-content">
                    <div class="card-icon">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#444" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
                            <circle cx="9" cy="7" r="4"/>
                            <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
                            <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
                        </svg>
                    </div>
                    <div class="card-text">
                        <div class="card-title">Rodzina</div>
                    </div>
                    <svg class="card-arrow" width="10" height="16" viewBox="0 0 10 16" fill="none">
                        <path d="M2 2L8 8L2 14" stroke="#bbb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </div>
            </div>
        </div>
    </div>

    <!-- ERROR POPUP -->
    <div id="errorPopup" class="error_popup_hidden">
        <div class="popup_box">
            <p class="popup_title">Coś poszło nie tak...</p>
            <p class="popup_desc">
                Wygląda na to że wystąpił błąd z połączeniem z siecią, spróbuj ponownie później.
            </p>
            <button id="popupClose">Rozumiem</button>
        </div>
    </div>
</body>
<script src="assets/bar.js?v=3" defer></script>
<script src="assets/theme.js?v=3" defer></script>
<script src="assets/manifest.js"></script>
<script>
    document.querySelectorAll(".error-trigger").forEach(el => {
        el.addEventListener("click", () => {
            document.getElementById("errorPopup").classList.remove("error_popup_hidden");
        });
    });
    document.getElementById("popupClose").addEventListener("click", () => {
        document.getElementById("errorPopup").classList.add("error_popup_hidden");
    });
</script>
</html>
