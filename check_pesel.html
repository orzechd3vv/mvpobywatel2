<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>mObywatel</title>
    <link rel="stylesheet" href="assets/check_pesel.css">
    <link rel="stylesheet" href="assets/main.css">
    <meta name="viewport" content="width=device-width, initial-scale=0.8, user-scalable=no">
</head>
<body class="has-blur-topbar">
    <div class="top_grid">
        <div class="action_grid" onclick="sendTo('services')">
            <svg class="back_arrow" width="12" height="20" viewBox="0 0 12 20" fill="none">
                <path d="M10 2L2 10L10 18" stroke="#3b82f6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <p class="back_text">Usługi</p>
        </div>
        <p class="title_text">Sprawdź PESEL</p>
    </div>

    <div class="container" style="padding-top: 80px;">
        <div class="icon-section">
            <div class="icon-circle">
                <img src="./services_files/check_pesel.png" alt="Sprawdź PESEL" style="width: 50px; height: 50px;">
            </div>
        </div>

        <div class="titleall">
            <div class="title">Sprawdź PESEL<br>drugiej osoby</div>
            <div class="subtitle">Chcesz załatwić z kimś sprawę? Dowiedz się, czy ma zastrzeżony PESEL, czy nie.</div>
        </div>

        <div class="subtitle" style="font-weight: 600; font-size: 16px; margin-bottom: 12px; color: white;">W czyim imieniu sprawdzasz?</div>

        <div class="cards">
            <div class="card" onclick="sendTo('check_pesel_own')">
                <div class="card-content">
                    <div class="card-title">Własnym</div>
                    <svg class="card-arrow" width="10" height="16" viewBox="0 0 10 16" fill="none">
                        <path d="M2 2L8 8L2 14" stroke="#bbb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </div>
            </div>
            <div class="card-divider"></div>
            <div class="card" onclick="sendTo('check_pesel_company')">
                <div class="card-content">
                    <div class="card-title">Firmy lub instytucji</div>
                    <svg class="card-arrow" width="10" height="16" viewBox="0 0 10 16" fill="none">
                        <path d="M2 2L8 8L2 14" stroke="#bbb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </div>
            </div>
        </div>
    </div>
</body>
<script src="assets/bar.js" defer></script>
<script src="assets/theme.js" defer></script>
</html>
