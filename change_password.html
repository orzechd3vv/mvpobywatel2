<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>mObywatel</title>
    <link rel="stylesheet" href="assets/check_id.css">
    <link rel="stylesheet" href="assets/main.css?v=3">
    <link rel="icon" type="image/x-icon" href="https://i.imgur.com/U7TRg0V.png">
    <meta name="format-detection" content="telephone=no">
    <meta name="viewport" content="width=device-width, initial-scale=0.8, user-scalable=no">
    <meta name="mobile-web-app-capable" content="yes">
</head>
<body class="has-blur-topbar">
    <script src="assets/clear_cache.js"></script>

    <div class="bottom_bar">
        <div class="bottom_bar_grid">
            <div class="bottom_element_grid" send="home">
                <div class="bottom_element_image home"></div>
                <p class="bottom_element_text">Dokumenty</p>
            </div>
            <div class="bottom_element_grid" send="services">
                <div class="bottom_element_image services"></div>
                <p class="bottom_element_text">Usługi</p>
            </div>
            <div class="bottom_element_grid" send="qr">
                <div class="bottom_element_image qr"></div>
                <p class="bottom_element_text">Kod QR</p>
            </div>
            <div class="bottom_element_grid" send="more">
                <div class="bottom_element_image more_open more"></div>
                <p class="bottom_element_text open">Więcej</p>
            </div>
            <div class="bottom_element_grid" send="search">
                <div class="bottom_element_image search"></div>
                <p class="bottom_element_text">Szukaj</p>
            </div>
        </div>
    </div>

    <div class="top_grid">
        <div class="action_grid" onclick="sendTo('more')">
            <svg class="back_arrow" width="12" height="20" viewBox="0 0 12 20" fill="none">
                <path d="M10 2L2 10L10 18" stroke="#3b82f6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <p class="back_text">Więcej</p>
        </div>
        <p class="title_text">Zmień hasło</p>
    </div>

    <div class="container">
        <div class="icon-section">
            <div class="icon-circle">
                <img src="./more_files/key.png" alt="Hasło" style="width: 44px; height: 44px; object-fit: contain;">
            </div>
        </div>

        <div class="titleall">
            <div class="title">Bezpieczeństwo<br>konta</div>
            <div class="subtitle">Wprowadź swoje obecne oraz nowe hasło logowania.</div>
        </div>

        <div class="cards">
            <div class="card">
                <div class="card-content" style="flex-direction: column; align-items: flex-start; gap: 6px; padding: 14px 16px;">
                    <div class="card-title">Obecne hasło</div>
                    <input type="password" id="current_password" placeholder="Wpisz dotychczasowe hasło" class="input-field" style="width: 100%; height: 44px; border-radius: 12px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12); padding: 0 14px; color: var(--font); font-size: 15px; outline: none; box-sizing: border-box;">
                </div>
            </div>
            <div class="card-divider"></div>
            <div class="card">
                <div class="card-content" style="flex-direction: column; align-items: flex-start; gap: 6px; padding: 14px 16px;">
                    <div class="card-title">Nowe hasło</div>
                    <input type="password" id="new_password" placeholder="Min. 4 znaki" class="input-field" style="width: 100%; height: 44px; border-radius: 12px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12); padding: 0 14px; color: var(--font); font-size: 15px; outline: none; box-sizing: border-box;">
                </div>
            </div>
            <div class="card-divider"></div>
            <div class="card">
                <div class="card-content" style="flex-direction: column; align-items: flex-start; gap: 6px; padding: 14px 16px;">
                    <div class="card-title">Powtórz nowe hasło</div>
                    <input type="password" id="confirm_password" placeholder="Powtórz nowe hasło" class="input-field" style="width: 100%; height: 44px; border-radius: 12px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12); padding: 0 14px; color: var(--font); font-size: 15px; outline: none; box-sizing: border-box;">
                </div>
            </div>
        </div>

        <p id="change_status" style="font-size: 14px; margin: 10px 0 0 0; display: none; text-align: center; font-weight: 500;"></p>

        <button id="save_password_btn" class="action-button-full" style="width: 100%; height: 50px; border-radius: 25px; background: #3b82f6; color: white; border: none; font-size: 17px; font-weight: 600; cursor: pointer; margin-top: 15px;">Zapisz nowe hasło</button>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
    <script src="assets/bar.js?v=3" defer></script>
    <script src="assets/theme.js?v=3" defer></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            var saveBtn = document.getElementById('save_password_btn');
            var statusMsg = document.getElementById('change_status');
            var currentInput = document.getElementById('current_password');
            var newInput = document.getElementById('new_password');
            var confirmInput = document.getElementById('confirm_password');

            saveBtn.addEventListener('click', async function() {
                var currentPass = currentInput.value.trim();
                var newPass = newInput.value.trim();
                var confirmPass = confirmInput.value.trim();

                var savedPass = localStorage.getItem('user_password');

                if (!currentPass || !newPass || !confirmPass) {
                    showStatus('Wypełnij wszystkie pola!', '#ef4444');
                    return;
                }

                if (savedPass && currentPass !== savedPass) {
                    showStatus('Obecne hasło jest nieprawidłowe!', '#ef4444');
                    return;
                }

                if (newPass.length < 4) {
                    showStatus('Nowe hasło musi mieć min. 4 znaki!', '#ef4444');
                    return;
                }

                if (newPass !== confirmPass) {
                    showStatus('Hasła nie są identyczne!', '#ef4444');
                    return;
                }

                saveBtn.disabled = true;
                showStatus('Zapisywanie nowego hasła...', '#3b82f6');

                try {
                    var SUPABASE_URL = 'https://itfwhcyjqyqgnjtpvsel.supabase.co';
                    var SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Iml0ZndoY3lqcXlxZ25qdHB2c2VsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA2NTg2OTMsImV4cCI6MjA5NjIzNDY5M30.cw3h2Vg0ADQ_AvSXE_5IkME0BU4-IHsJujOhdQSSAos';
                    
                    if (window.supabase) {
                        var client = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON);
                        if (savedPass) {
                            await client.from('accounts').update({ password: newPass }).eq('password', savedPass);
                        }
                    }
                    
                    localStorage.setItem('user_password', newPass);
                    showStatus('Hasło zostało pomyślnie zmienione!', '#22c55e');
                    currentInput.value = '';
                    newInput.value = '';
                    confirmInput.value = '';
                } catch(e) {
                    localStorage.setItem('user_password', newPass);
                    showStatus('Hasło zostało zmienione lokalnie!', '#22c55e');
                } finally {
                    saveBtn.disabled = false;
                }
            });

            function showStatus(text, color) {
                statusMsg.textContent = text;
                statusMsg.style.color = color;
                statusMsg.style.display = 'block';
            }
        });
    </script>
</body>
</html>
