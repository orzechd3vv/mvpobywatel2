<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"></head>
<body>
    <div id="loginBox" style="text-align:center; padding: 50px;">
        <input type="text" id="adminLogin" placeholder="Login"><br>
        <input type="password" id="adminPass" placeholder="Hasło"><br>
        <button onclick="testLogin()">Zaloguj</button>
    </div>

    <div id="adminPanel" style="display:none; padding: 20px;">
        <h3>Konta użytkowników:</h3>
        <table id="accountsTable" border="1" style="width:100%">
            <thead><tr><th>Użytkownik</th><th>PESEL</th><th>Akcje</th></tr></thead>
            <tbody></tbody>
        </table>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = 'https://itfwhcyjqyqgnjtpvsel.supabase.co';
        const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Iml0ZndoY3lqcXlxZ25qdHB2c2VsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA2NTg2OTMsImV4cCI6MjA5NjIzNDY5M30.cw3h2Vg0ADQ_AvSXE_5IkME0BU4-IHsJujOhdQSSAos';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

        async function testLogin() {
            var l = document.getElementById('adminLogin').value;
            var p = document.getElementById('adminPass').value;
            
            if(l === 'mvpob12' && p === 'Mvpmafiatop123!') {
                alert('LOGOWANIE OK');
                document.getElementById('loginBox').style.display = 'none';
                document.getElementById('adminPanel').style.display = 'block';
                await loadAccounts();
            } else {
                alert('BŁĘDNE DANE');
            }
        }

        async function loadAccounts() {
            const { data, error } = await supabase.from('accounts').select('*');
            if(error) { alert('Błąd bazy: ' + error.message); return; }
            
            const tbody = document.querySelector('#accountsTable tbody');
            tbody.innerHTML = '';
            data.forEach(acc => {
                tbody.innerHTML += `<tr>
                    <td>${acc.name || ''} ${acc.surname || ''}</td>
                    <td>${acc.pesel || ''}</td>
                    <td><button onclick="deleteAcc('${acc.id}')">Usuń</button></td>
                </tr>`;
            });
        }

        async function deleteAcc(id) {
            if(confirm('Na pewno usunąć?')) {
                await supabase.from('accounts').delete().eq('id', id);
                loadAccounts();
            }
        }
    </script>
</body>
</html>
