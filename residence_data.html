<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>mObywatel</title>
    <link rel="stylesheet" href="assets/card.css?v=1.2">
    <link rel="stylesheet" href="assets/main.css?v=3">
    <link rel="icon" type="image/x-icon" href="https://i.imgur.com/U7TRg0V.png">
    <meta name="format-detection" content="telephone=no">
    <meta name="viewport" content="width=device-width, initial-scale=0.8, user-scalable=no">
</head>
<body class="has-blur-topbar">
    <script src="assets/clear_cache.js"></script>

    <div class="top_grid topbar-always">
        <div class="action_grid" onclick="sendTo('more')">
            <img src="https://i.imgur.com/aXIO2NG.png" class="back_img">
            <p class="back_text">Więcej</p>
        </div>
        <p class="title_text">Dane zameldowania</p>
        <img src="https://i.imgur.com/VHNv1TC.png" class="help_img">
    </div>

    <div class="bottom_bar">
        <div class="bottom_bar_grid">
            <div class="bottom_element_grid" send="home">
                <div class="bottom_element_image home"></div>
                <p class="bottom_element_text">Dokumenty</p>
            </div>
            <div class="bottom_element_grid" send="services">
                <div class="bottom_element_image services"></div>
                <p class="bottom_element_text">Usługi</p>
            </div>
            <div class="bottom_element_grid" send="qr">
                <div class="bottom_element_image qr"></div>
                <p class="bottom_element_text">Kod QR</p>
            </div>
            <div class="bottom_element_grid" send="more">
                <div class="bottom_element_image more_open more"></div>
                <p class="bottom_element_text open">Więcej</p>
            </div>
            <div class="bottom_element_grid" send="search">
                <div class="bottom_element_image search"></div>
                <p class="bottom_element_text">Szukaj</p>
            </div>
        </div>
    </div>

    <div class="container" style="max-width: 400px; margin: 90px auto 140px;">
        <div class="card custom-card">
            <div class="field">
                <label>Adres zameldowania na pobyt stały</label>
                <strong id="residence_address" style="font-size: 20px;">-</strong>
            </div>

            <div class="field">
                <label>Miejscowość</label>
                <strong id="residence_city" style="font-size: 20px;">-</strong>
            </div>

            <div class="field" style="border-bottom: none;">
                <label>Data zameldowania</label>
                <strong id="residence_date" style="font-size: 20px;">-</strong>
            </div>
        </div>
    </div>

    <script src="assets/bar.js?v=3" defer></script>
    <script src="assets/theme.js?v=3" defer></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            var params = new URLSearchParams(window.location.search || localStorage.getItem('mobywatel_session') || '');
            
            var addr1 = params.get('adress1') || params.get('address1') || '';
            var addr2 = params.get('adress2') || params.get('address2') || '';
            var city = params.get('city') || '';
            var homeDate = params.get('home_date') || params.get('homeDate') || '';

            var fullAddress = (addr1 + ' ' + addr2).trim();
            if (!fullAddress) fullAddress = 'ul. Wiejska 10/12';
            if (!city) city = 'Warszawa';
            if (!homeDate) homeDate = '14.07.2023';

            document.getElementById('residence_address').textContent = fullAddress;
            document.getElementById('residence_city').textContent = city;
            document.getElementById('residence_date').textContent = homeDate;
        });
    </script>
</body>
</html>
