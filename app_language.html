<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>mObywatel</title>
    <link rel="stylesheet" href="assets/card.css?v=1.2">
    <link rel="stylesheet" href="assets/main.css?v=3">
    <link rel="icon" type="image/x-icon" href="https://i.imgur.com/U7TRg0V.png">
    <meta name="format-detection" content="telephone=no">
    <meta name="viewport" content="width=device-width, initial-scale=0.8, user-scalable=no">
</head>
<body class="has-blur-topbar">
    <script src="assets/clear_cache.js"></script>

    <div class="top_grid topbar-always">
        <div class="action_grid" onclick="sendTo('more')">
            <img src="https://i.imgur.com/aXIO2NG.png" class="back_img">
            <p class="back_text">Więcej</p>
        </div>
        <p class="title_text">Język aplikacji</p>
        <img src="https://i.imgur.com/VHNv1TC.png" class="help_img">
    </div>

    <div class="bottom_bar">
        <div class="bottom_bar_grid">
            <div class="bottom_element_grid" send="home">
                <div class="bottom_element_image home"></div>
                <p class="bottom_element_text">Dokumenty</p>
            </div>
            <div class="bottom_element_grid" send="services">
                <div class="bottom_element_image services"></div>
                <p class="bottom_element_text">Usługi</p>
            </div>
            <div class="bottom_element_grid" send="qr">
                <div class="bottom_element_image qr"></div>
                <p class="bottom_element_text">Kod QR</p>
            </div>
            <div class="bottom_element_grid" send="more">
                <div class="bottom_element_image more_open more"></div>
                <p class="bottom_element_text open">Więcej</p>
            </div>
            <div class="bottom_element_grid" send="search">
                <div class="bottom_element_image search"></div>
                <p class="bottom_element_text">Szukaj</p>
            </div>
        </div>
    </div>

    <div class="container" style="max-width: 400px; margin: 90px auto 140px;">
        <div class="card custom-card">
            <div class="field lang-item" data-lang="pl" style="cursor: pointer; display: flex; align-items: center; justify-content: space-between;">
                <div>
                    <strong>Polski</strong>
                    <label style="font-size: 13px;">Język domyślny</label>
                </div>
                <span class="check-icon" style="color: #4ba4fe; font-weight: 700; font-size: 20px;">✓</span>
            </div>

            <div class="field lang-item" data-lang="en" style="cursor: pointer; display: flex; align-items: center; justify-content: space-between;">
                <div>
                    <strong>English</strong>
                    <label style="font-size: 13px;">English language</label>
                </div>
                <span class="check-icon" style="color: #4ba4fe; font-weight: 700; font-size: 20px; display: none;">✓</span>
            </div>

            <div class="field lang-item" data-lang="ua" style="border-bottom: none; cursor: pointer; display: flex; align-items: center; justify-content: space-between;">
                <div>
                    <strong>Українська</strong>
                    <label style="font-size: 13px;">Ukraiński</label>
                </div>
                <span class="check-icon" style="color: #4ba4fe; font-weight: 700; font-size: 20px; display: none;">✓</span>
            </div>
        </div>
    </div>

    <script src="assets/bar.js?v=3" defer></script>
    <script src="assets/theme.js?v=3" defer></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            var items = document.querySelectorAll('.lang-item');
            var savedLang = localStorage.getItem('app_language') || 'pl';

            function updateUI(lang) {
                items.forEach(function(item) {
                    var check = item.querySelector('.check-icon');
                    if (item.getAttribute('data-lang') === lang) {
                        check.style.display = 'block';
                    } else {
                        check.style.display = 'none';
                    }
                });
            }

            updateUI(savedLang);

            items.forEach(function(item) {
                item.addEventListener('click', function() {
                    var selected = this.getAttribute('data-lang');
                    localStorage.setItem('app_language', selected);
                    updateUI(selected);
                });
            });
        });
    </script>
</body>
</html>
