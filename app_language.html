<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>mObywatel</title>
    <link rel="stylesheet" href="assets/check_id.css">
    <link rel="stylesheet" href="assets/main.css?v=3">
    <link rel="icon" type="image/x-icon" href="https://i.imgur.com/U7TRg0V.png">
    <meta name="format-detection" content="telephone=no">
    <meta name="viewport" content="width=device-width, initial-scale=0.8, user-scalable=no">
    <meta name="mobile-web-app-capable" content="yes">
</head>
<body class="has-blur-topbar">
    <script src="assets/clear_cache.js"></script>

    <div class="bottom_bar">
        <div class="bottom_bar_grid">
            <div class="bottom_element_grid" send="home">
                <div class="bottom_element_image home"></div>
                <p class="bottom_element_text">Dokumenty</p>
            </div>
            <div class="bottom_element_grid" send="services">
                <div class="bottom_element_image services"></div>
                <p class="bottom_element_text">Usługi</p>
            </div>
            <div class="bottom_element_grid" send="qr">
                <div class="bottom_element_image qr"></div>
                <p class="bottom_element_text">Kod QR</p>
            </div>
            <div class="bottom_element_grid" send="more">
                <div class="bottom_element_image more_open more"></div>
                <p class="bottom_element_text open">Więcej</p>
            </div>
            <div class="bottom_element_grid" send="search">
                <div class="bottom_element_image search"></div>
                <p class="bottom_element_text">Szukaj</p>
            </div>
        </div>
    </div>

    <div class="top_grid">
        <div class="action_grid" onclick="sendTo('more')">
            <svg class="back_arrow" width="12" height="20" viewBox="0 0 12 20" fill="none">
                <path d="M10 2L2 10L10 18" stroke="#3b82f6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <p class="back_text">Więcej</p>
        </div>
        <p class="title_text">Język aplikacji</p>
    </div>

    <div class="container">
        <div class="icon-section">
            <div class="icon-circle">
                <img src="./more_files/language.png" alt="Język" style="width: 44px; height: 44px; object-fit: contain;">
            </div>
        </div>

        <div class="titleall">
            <div class="title">Wybierz język<br>aplikacji</div>
            <div class="subtitle">Zmień preferowany język wyświetlania interfejsu.</div>
        </div>

        <div class="cards">
            <div class="card lang-item" data-lang="pl" style="cursor: pointer;">
                <div class="card-content">
                    <div class="card-text">
                        <div class="card-title">Polski</div>
                        <div class="card-desc">Język domyślny</div>
                    </div>
                    <span class="check-icon" style="color: #3b82f6; font-weight: 700; font-size: 20px;">✓</span>
                </div>
            </div>
            <div class="card-divider"></div>
            <div class="card lang-item" data-lang="en" style="cursor: pointer;">
                <div class="card-content">
                    <div class="card-text">
                        <div class="card-title">English</div>
                        <div class="card-desc">English language</div>
                    </div>
                    <span class="check-icon" style="color: #3b82f6; font-weight: 700; font-size: 20px; display: none;">✓</span>
                </div>
            </div>
            <div class="card-divider"></div>
            <div class="card lang-item" data-lang="ua" style="cursor: pointer;">
                <div class="card-content">
                    <div class="card-text">
                        <div class="card-title">Українська</div>
                        <div class="card-desc">Ukraiński</div>
                    </div>
                    <span class="check-icon" style="color: #3b82f6; font-weight: 700; font-size: 20px; display: none;">✓</span>
                </div>
            </div>
        </div>
    </div>

    <script src="assets/bar.js?v=3" defer></script>
    <script src="assets/theme.js?v=3" defer></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            var items = document.querySelectorAll('.lang-item');
            var savedLang = localStorage.getItem('app_language') || 'pl';

            function updateUI(lang) {
                items.forEach(function(item) {
                    var check = item.querySelector('.check-icon');
                    if (item.getAttribute('data-lang') === lang) {
                        check.style.display = 'block';
                    } else {
                        check.style.display = 'none';
                    }
                });
            }

            updateUI(savedLang);

            items.forEach(function(item) {
                item.addEventListener('click', function() {
                    var selected = this.getAttribute('data-lang');
                    localStorage.setItem('app_language', selected);
                    updateUI(selected);
                });
            });
        });
    </script>
</body>
</html>
