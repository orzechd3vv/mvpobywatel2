<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>mObywatel</title>
    <link rel="stylesheet" href="assets/service_page.css">
    <link rel="stylesheet" href="assets/main.css">
    <meta name="viewport" content="width=device-width, initial-scale=0.8, user-scalable=no">
</head>
<body class="has-blur-topbar">
    <div class="bottom_bar">
        <div class="bottom_bar_grid">
            <div class="bottom_element_grid" send="home"><div class="bottom_element_image home"></div><p>Dokumenty</p></div>
            <div class="bottom_element_grid" send="services"><div class="bottom_element_image services_open services"></div><p class="open">Usługi</p></div>
            <div class="bottom_element_grid" send="qr"><div class="bottom_element_image qr"></div><p>Kod QR</p></div>
            <div class="bottom_element_grid" send="more"><div class="bottom_element_image more"></div><p>Więcej</p></div>
        </div>
    </div>
    <div class="top_grid">
        <div class="action_grid" onclick="sendTo('services')">
            <svg width="12" height="20" viewBox="0 0 12 20" fill="none"><path d="M10 2L2 10L10 18" stroke="#3b82f6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <p class="back_text">Wróć</p>
        </div>
        <p class="title_text">Załatw sprawę</p>
    </div>
    <div class="container" style="padding-top:80px;">
        <div class="icon-circle" style="background:#ede9fe;"><img src="./services_files/finish_case.png" style="width:50px;"></div>
        <div class="title" style="font-size:32px;">Załatwiaj sprawy urzędowe online</div>
        <div class="subtitle">Złóż wniosek w aplikacji – szybko i wygodnie.</div>
        <div class="cards">
            <div class="card"><div class="card-content"><div class="card-title">Dowód osobisty</div><div class="card-arrow">›</div></div></div>
            <div class="card-divider"></div>
            <div class="card"><div class="card-content"><div class="card-title">Paszport</div><div class="card-arrow">›</div></div></div>
            <div class="card-divider"></div>
            <div class="card"><div class="card-content"><div class="card-title">Rodzina</div><div class="card-arrow">›</div></div></div>
        </div>
    </div>
</body>
<script src="assets/bar.js" defer></script>
</html>
