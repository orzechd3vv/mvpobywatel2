    <title>mObywatel</title>
    
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <link rel="stylesheet" href="assetsdiff/main.css">

<body class="has-blur-topbar hero-layout">

    <div class="bottom_bar">
        <div class="bottom_bar_grid">
            <div class="bottom_element_grid" send="home">
                <div class="bottom_element_image home_open home"></div>
                <p class="bottom_element_text open">Dokumenty</p>
            </div>
            <div class="bottom_element_grid" send="services">
                <div class="bottom_element_image services"></div>
                <p class="bottom_element_text">Usługi</p>
            </div>
            <div class="bottom_element_grid" send="qr">
                <div class="bottom_element_image qr"></div>
                <p class="bottom_element_text">Kod QR</p>
            </div>
            <div class="bottom_element_grid" send="more">
                <div class="bottom_element_image more"></div>
                <p class="bottom_element_text">Więcej</p>
            </div>
            <div class="bottom_element_grid" send="search">
                <div class="bottom_element_image search"></div>
                <p class="bottom_element_text">Szukaj</p>
            </div>
        </div>
    </div>

    <div class="top_slide_bar">
        <img class="main_page_logo" src="./more_files/logo_large.png">
        <p class="main_title">Wygląd</p>
        <p class="main_button" onclick="sendTo('more')">← Wróć</p>
    </div>

    <header class="hero-header" data-hero data-hero-collapse-offset="24">
        <div class="hero-header__row">
            <div class="hero-header__logo">
                <img src="./more_files/logo_large.png" alt="Godło" />
            </div>
            <div class="hero-header__texts">
                <p class="hero-header__title">Wygląd</p>
                <p class="hero-header__subtitle">Wybierz motyw</p>
            </div>
        </div>
    </header>

    <div class="container">
        <p class="title">Wygląd</p>
        
        <div class="appearance-options">
            <!-- Light Mode -->
            <label class="appearance-option">
                <input type="radio" name="theme" value="light" class="theme-radio">
                <div class="radio-custom"></div>
                <div class="option-content">
                    <p class="option-title">Tryb jasny</p>
                </div>
            </label>

            <!-- Dark Mode -->
            <label class="appearance-option">
                <input type="radio" name="theme" value="dark" class="theme-radio">
                <div class="radio-custom"></div>
                <div class="option-content">
                    <p class="option-title">Tryb ciemny</p>
                </div>
            </label>

            <!-- Automatic Mode -->
            <label class="appearance-option">
                <input type="radio" name="theme" value="auto" class="theme-radio">
                <div class="radio-custom"></div>
                <div class="option-content">
                    <p class="option-title">Automatyczny</p>
                    <p class="option-description">Wygląd dopasowany do motywu wyświetlacza urządzenia</p>
                </div>
            </label>
        </div>
    </div>

    <script src="assets/hero.js" defer></script>
    <script src="assets/bar.js" defer></script>
    <script src="assets/theme.js" defer></script>
    <script src="assetsdiff/manifest.js.pobrane"></script>
    <script src="assetsdiff/cache.js.pobrane"></script>
    <script src="assetsdiff/flow.js.pobrane"></script>
</body>
</html>
